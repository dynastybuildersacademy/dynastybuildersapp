[build]
  base      = "."
  publish   = "site"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/auth.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[[redirects]]
  from  = "/lights-out-2026"
  to    = "/lights-out.html"
  status = 200
  force  = true

[[redirects]]
  from  = "/api/monday"
  to    = "/.netlify/functions/monday"
  status = 200
  force  = true

[[redirects]]
  from  = "/api/ai"
  to    = "/.netlify/functions/ai"
  status = 200
  force  = true

[[redirects]]
  from  = "/api/openai"
  to    = "/.netlify/functions/openai"
  status = 200
  force  = true

[[redirects]]
  from  = "/*"
  to    = "/index.html"
  status = 200
  force  = false

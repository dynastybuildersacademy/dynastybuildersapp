let done = 0, errors = 0, running = false;

function log(msg, cls='') {
  const el = document.getElementById('log');
  el.innerHTML += `<span class="${cls}">${msg}</span><br>`;
  el.scrollTop = el.scrollHeight;
}

function updateStats() {
  const total = MIGRATIONS.length;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-err').textContent = errors;
  const pct = Math.round((done + errors) / total * 100);
  document.getElementById('s-pct').textContent = pct + '%';
  document.getElementById('progress-bar').style.width = pct + '%';
}

async function mondayMutation(query) {
  const r = await fetch('/.netlify/functions/monday', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({query})
  });
  return r.json();
}

async function createBatch(batch, batchIdx) {
  const aliases = batch.map((item, i) => {
    const name = item.name.replace(/\\/g,'\\\\').replace(/"/g,'\\"');
    const cv = JSON.stringify(JSON.stringify(item.column_values));
    return `b${i}: create_item(board_id: ${DEST_BOARD}, group_id: "${item.group_id}", item_name: "${name}", column_values: ${cv}) { id name }`;
  }).join('\n  ');
  
  const mutation = `mutation {\n  ${aliases}\n}`;
  
  try {
    const res = await mondayMutation(mutation);
    if (res.errors) {
      log(`Batch ${batchIdx}: API error — ${res.errors[0]?.message}`, 'err');
      errors += batch.length;
    } else {
      done += batch.length;
      if (batchIdx % 5 === 0) {
        log(`✓ ${done} items created...`, 'ok');
      }
    }
  } catch(e) {
    log(`Batch ${batchIdx}: ${e.message}`, 'err');
    errors += batch.length;
  }
  updateStats();
}

async function startMigration() {
  if (running) return;
  running = true;
  document.getElementById('start-btn').disabled = true;
  document.getElementById('status-msg').textContent = 'Migration in progress — do not close this tab.';
  
  log(`Starting migration of ${MIGRATIONS.length} items...`, 'info');
  
  const BATCH = 10;
  for (let i = 0; i < MIGRATIONS.length; i += BATCH) {
    const batch = MIGRATIONS.slice(i, i + BATCH);
    await createBatch(batch, Math.floor(i/BATCH));
    await new Promise(r => setTimeout(r, 250)); // rate limit buffer
  }
  
  log(``, '');
  log(`🎉 Migration complete! ${done} created, ${errors} errors.`, 'info');
  document.getElementById('start-btn').textContent = '✓ Done';
  document.getElementById('status-msg').textContent = `Finished. Open board ${DEST_BOARD} in Monday.com to verify.`;
  running = false;
}

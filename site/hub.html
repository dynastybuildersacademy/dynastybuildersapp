<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBA — Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="auth.js?v=20260713"></script>
<style>
:root{--navy:#0A1628;--navy-mid:#112040;--navy-light:#1A3158;--gold:#C9A84C;--gold-light:#E8C97A;--gold-pale:#F5E8C0;--cream:#FAF6EE;--success:#27AE60;--warn:#E67E22;--danger:#C0392B;--slate:#6B7C93;--border:rgba(201,168,76,0.22);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--navy);color:var(--cream);min-height:100vh;overflow-x:hidden;}
.app{display:flex;height:100vh;overflow:hidden;}

/* ── SIDEBAR ── */
.sidebar{width:256px;min-width:256px;background:var(--navy-mid);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;z-index:100;transition:transform 0.3s;}
.sb-logo{padding:18px 18px 14px;border-bottom:1px solid var(--border);}
.sb-shield{width:30px;height:34px;background:linear-gradient(160deg,var(--gold) 0%,#7a5c14 100%);clip-path:polygon(50% 0%,100% 18%,100% 65%,50% 100%,0% 65%,0% 18%);display:flex;align-items:center;justify-content:center;font-size:13px;margin-bottom:8px;}
.sb-logo h1{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700;color:var(--gold);line-height:1.2;}
.sb-logo p{font-size:10px;color:var(--slate);letter-spacing:0.08em;text-transform:uppercase;margin-top:2px;}
.sb-agent{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold) 0%,#7a5c14 100%);display:flex;align-items:center;justify-content:center;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;color:var(--navy);flex-shrink:0;}
.sb-name{font-size:13px;font-weight:600;}
.sb-role{font-size:10px;color:var(--slate);text-transform:uppercase;letter-spacing:0.07em;margin-top:1px;}
.sb-nav{flex:1;padding:8px 0;overflow-y:auto;}
.nav-section{font-size:9px;color:var(--slate);letter-spacing:0.12em;text-transform:uppercase;padding:12px 18px 5px;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 18px;font-size:12px;color:var(--slate);cursor:pointer;transition:all 0.15s;text-decoration:none;border-left:3px solid transparent;}
.nav-item:hover{color:var(--cream);background:rgba(201,168,76,0.05);}
.nav-item.active{color:var(--gold-light);background:rgba(201,168,76,0.08);border-left-color:var(--gold);}
.nav-item .icon{font-size:14px;flex-shrink:0;width:18px;text-align:center;}
.nav-item.locked{opacity:0.3;pointer-events:none;}
.nav-item .new-badge{margin-left:auto;background:var(--gold);color:var(--navy);font-size:8px;font-weight:700;padding:1px 5px;border-radius:2px;font-family:Barlow Condensed,sans-serif;letter-spacing:0.05em;}
.sb-bottom{padding:12px 18px;border-top:1px solid var(--border);}
.logout-btn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--slate);cursor:pointer;padding:7px 0;transition:color 0.15s;}
.logout-btn:hover{color:var(--cream);}

/* ── MOBILE ── */
.sb-toggle{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--gold);border:none;border-radius:3px;padding:7px 9px;cursor:pointer;font-size:15px;color:var(--navy);}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:99;}
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:200;}
  .sidebar.open{transform:translateX(0);}
  .sb-toggle{display:block;}
  .sb-overlay.open{display:block;}
}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:1px solid var(--border);background:rgba(10,22,40,0.97);backdrop-filter:blur(10px);position:sticky;top:0;z-index:50;flex-shrink:0;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-title{font-family:Barlow Condensed,sans-serif;font-size:16px;font-weight:700;letter-spacing:0.04em;}
.topbar-date{font-size:11px;color:var(--slate);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.top-link{font-size:11px;color:var(--gold);text-decoration:none;border:1px solid var(--border);padding:5px 11px;border-radius:3px;transition:border-color 0.15s;white-space:nowrap;}
.top-link:hover{border-color:var(--gold);}
.content{padding:20px 22px;flex:1;}
@media(max-width:768px){.content{padding:14px;}.topbar{padding:12px 14px 12px 50px;}}

/* ── GRIDS ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;}
@media(max-width:1000px){.grid4{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:1fr;}}

/* ── BASE CARDS ── */
.card{background:var(--navy-mid);border:1px solid var(--border);border-radius:4px;padding:18px 20px;}
.card-title{font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:7px;}

/* ── KPI CARDS ── */
.kpi{background:var(--navy-light);border:1px solid var(--border);border-radius:4px;padding:14px 16px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold) 0%,transparent 100%);}
.kpi-label{font-size:10px;color:var(--slate);text-transform:uppercase;letter-spacing:0.09em;}
.kpi-val{font-family:Barlow Condensed,sans-serif;font-size:30px;font-weight:800;color:var(--gold-light);margin:4px 0 2px;line-height:1;}
.kpi-sub{font-size:11px;color:var(--slate);}

/* ── TOOL LAUNCHER GRID ── */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:22px;}
.tool-card{
  background:var(--navy-light);border:1px solid var(--border);border-radius:4px;
  padding:16px 14px;display:flex;flex-direction:column;gap:8px;
  text-decoration:none;color:var(--cream);transition:all 0.2s;cursor:pointer;
  position:relative;
}
.tool-card:hover{border-color:var(--gold);background:rgba(201,168,76,0.07);transform:translateY(-1px);}
.tool-card.locked{opacity:0.35;pointer-events:none;}
.tool-card .tc-icon{font-size:22px;}
.tool-card .tc-name{font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;letter-spacing:0.04em;line-height:1.2;}
.tool-card .tc-desc{font-size:11px;color:var(--slate);line-height:1.4;}
.tool-card .tc-badge{position:absolute;top:8px;right:8px;font-size:8px;font-weight:700;padding:2px 6px;border-radius:2px;font-family:Barlow Condensed,sans-serif;letter-spacing:0.05em;}
.tc-badge.new{background:var(--gold);color:var(--navy);}
.tc-badge.md{background:rgba(201,168,76,0.2);color:var(--gold);border:1px solid rgba(201,168,76,0.4);}
.tc-badge.ext{background:rgba(52,152,219,0.15);color:#5dade2;border:1px solid rgba(52,152,219,0.3);}

/* ── QUICK ACTIONS ── */
.action-card{background:var(--navy-mid);border:1px solid var(--border);border-radius:4px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;text-decoration:none;color:var(--cream);transition:all 0.2s;}
.action-card:hover{border-color:var(--gold);background:rgba(201,168,76,0.06);}
.action-num{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-family:Barlow Condensed,sans-serif;font-size:15px;font-weight:800;flex-shrink:0;}
.action-body h3{font-family:Barlow Condensed,sans-serif;font-size:14px;font-weight:700;letter-spacing:0.03em;margin-bottom:3px;}
.action-body p{font-size:12px;color:var(--slate);line-height:1.5;}

/* ── PROGRESS RING ── */
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:16px 0;}
.ring-svg{transform:rotate(-90deg);}
.ring-track{fill:none;stroke:rgba(201,168,76,0.15);stroke-width:8;}
.ring-fill{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 0.8s ease;}

/* ── TEAM TABLE ── */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead tr{border-bottom:1px solid var(--gold);}
th{font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;color:var(--gold);letter-spacing:0.1em;text-transform:uppercase;padding:8px 10px;text-align:left;white-space:nowrap;}
tbody tr{border-bottom:1px solid rgba(201,168,76,0.07);transition:background 0.15s;}
tbody tr:hover{background:rgba(201,168,76,0.04);}
td{padding:9px 10px;font-size:12px;vertical-align:middle;}
.badge{display:inline-block;padding:2px 7px;border-radius:2px;font-size:9px;font-weight:700;font-family:Barlow Condensed,sans-serif;letter-spacing:0.04em;}
.badge-md{background:rgba(201,168,76,0.18);color:var(--gold);border:1px solid rgba(201,168,76,0.3);}
.badge-dir{background:rgba(39,174,96,0.15);color:#2ecc71;border:1px solid rgba(39,174,96,0.3);}
.badge-fa{background:rgba(93,173,226,0.15);color:#5dade2;border:1px solid rgba(93,173,226,0.3);}
.badge-assoc{background:rgba(187,143,206,0.15);color:#bb8fce;border:1px solid rgba(187,143,206,0.3);}
.badge-train{background:rgba(107,124,147,0.15);color:var(--slate);border:1px solid rgba(107,124,147,0.3);}
.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--gold) 0%,#8a6010 100%);display:inline-flex;align-items:center;justify-content:center;font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;color:var(--navy);}
.prog-bar{height:4px;background:rgba(201,168,76,0.1);border-radius:2px;width:72px;display:inline-block;vertical-align:middle;}
.prog-fill{height:4px;border-radius:2px;background:var(--gold);}

/* ── AI CHAT ── */
.chat-box{background:var(--navy);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.chat-msgs{height:240px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px;}
.chat-msgs::-webkit-scrollbar{width:3px;}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px;}
.msg{max-width:88%;padding:8px 12px;border-radius:4px;font-size:13px;line-height:1.55;}
.msg.user{align-self:flex-end;background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);}
.msg.ai{align-self:flex-start;background:var(--navy-light);border:1px solid var(--border);}
.msg.ai .name{font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:3px;}
.msg.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--slate);margin:0 1px;animation:blink 1s infinite;}
.msg.typing span:nth-child(2){animation-delay:0.2s;}
.msg.typing span:nth-child(3){animation-delay:0.4s;}
@keyframes blink{0%,100%{opacity:0.2;}50%{opacity:1;}}
.chat-prompts{display:flex;flex-wrap:wrap;gap:6px;padding:9px 12px;border-bottom:1px solid var(--border);}
.chip{padding:4px 10px;border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--slate);cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.chip:hover{border-color:var(--gold);color:var(--gold);}
.chat-input-row{display:flex;border-top:1px solid var(--border);}
.chat-input{flex:1;background:transparent;border:none;padding:10px 13px;color:var(--cream);font-family:'Barlow',sans-serif;font-size:13px;}
.chat-input:focus{outline:none;}
.chat-input::placeholder{color:var(--slate);}
.chat-send{background:var(--gold);border:none;padding:0 16px;color:var(--navy);cursor:pointer;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;transition:opacity 0.2s;}
.chat-send:hover{opacity:0.85;}

/* ── SECTION HEADERS ── */
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px;}
.section-hdr h2{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--gold);}
.view-all{font-size:11px;color:var(--gold);text-decoration:none;letter-spacing:0.06em;text-transform:uppercase;}
.view-all:hover{text-decoration:underline;}

/* ── ALERT BANNERS ── */
.alert{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:4px;margin-bottom:10px;font-size:13px;}
.alert-gold{background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.3);}
.alert-green{background:rgba(39,174,96,0.1);border:1px solid rgba(39,174,96,0.25);}
.alert-red{background:rgba(192,50,50,0.1);border:1px solid rgba(192,50,50,0.25);}

/* ── LIGHTS OUT COUNTDOWN ── */
.lights-out-banner{
  background:linear-gradient(135deg,#06060a 0%,#0c0c12 50%,#111118 100%);
  border:1px solid rgba(232,0,45,0.4);border-radius:6px;
  padding:20px 22px;margin-bottom:20px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
  position:relative;overflow:hidden;
}
.lights-out-banner::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#e8002d,transparent);}
.lo-title{font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:700;color:#e8002d;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:4px;}
.lo-name{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--cream);font-weight:700;}
.lo-sub{font-size:11px;color:var(--slate);margin-top:3px;}
.countdown{display:flex;gap:12px;align-items:center;}
.cd-unit{text-align:center;background:rgba(232,0,45,0.1);border:1px solid rgba(232,0,45,0.3);border-radius:4px;padding:10px 14px;min-width:58px;}
.cd-num{font-family:Barlow Condensed,sans-serif;font-size:28px;font-weight:800;color:var(--cream);line-height:1;}
.cd-lbl{font-size:9px;color:var(--slate);text-transform:uppercase;letter-spacing:0.09em;margin-top:2px;}
.lo-action{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.lo-link{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:3px;font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;text-decoration:none;transition:opacity 0.2s;letter-spacing:0.05em;white-space:nowrap;}
.lo-link.primary{background:#e8002d;color:#fff;}
.lo-link.secondary{background:var(--gold);color:var(--navy);}
.lo-link:hover{opacity:0.85;}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy-mid);border:1px solid var(--gold);border-radius:4px;padding:10px 18px;font-size:13px;transform:translateY(60px);opacity:0;transition:all 0.3s;z-index:999;color:var(--gold-light);}
.toast.show{transform:translateY(0);opacity:1;}
</style>
</head>
<body>

<button class="sb-toggle" onclick="toggleSidebar()">☰</button>
<div class="sb-overlay" id="sb-overlay" onclick="toggleSidebar()"></div>

<div class="app">
  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">
      <div class="sb-shield">👑</div>
      <h1>Dynasty Builders<br>Academy</h1>
      <p>PHP Agency Platform</p>
    </div>
    <div class="sb-agent">
      <div class="sb-avatar" id="sb-av">–</div>
      <div>
        <div class="sb-name" id="sb-name">Loading…</div>
        <div class="sb-role" id="sb-role">–</div>
      </div>
    </div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-bottom">
      <div style="font-size:10px;color:var(--slate);margin-bottom:8px;">Making Dreams Come True</div>
      <div class="logout-btn" onclick="AUTH.logout()">⏻ Sign Out</div>
    </div>
  </aside>

  <!-- ══ MAIN ══ -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="topbar-greeting">Command Center</div>
        <div class="topbar-date" id="topbar-date"></div>
      </div>
      <div class="topbar-right">
        <a href="pmd-hub.html" class="top-link" id="pmd-link" style="display:none;">⚙️ PMD Hub</a>
        <a href="agents.html" class="top-link" id="roster-link" style="display:none;">👥 Agent Roster</a>
        <a href="https://app.phpbamboo.com/agent/signin" target="_blank" class="top-link">PHP Bamboo ↗</a>
      </div>
    </div>

    <div id="monday-sync-banner" style="display:none;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.3);border-radius:4px;padding:14px 18px;margin:10px 20px 0;position:relative;"></div>
    <div class="content" id="main-content">
      <div style="text-align:center;padding:60px;color:var(--slate);">Loading…</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── SHARED STATE (declared first — must be before IIFE) ───────
const chatHistory = {};
const chatSystems = {};

// ── INIT ──────────────────────────────────────────────────────
(function init() {
  if (!AUTH.require('hub.html')) return;
  const session = AUTH.getSession();

  // Sidebar
  buildSidebarNav(session);

  // Topbar
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('topbar-greeting').textContent = `${greeting}, ${session.name.split(' ')[0]}`;
  document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

  // Show Monday sync notification for admins
  if (session.level >= 60) renderMondaySyncBanner(session);

  // Show PMD Hub link for MD+
  if (session.level >= 80) { const pl = document.getElementById('pmd-link'); if(pl) pl.style.display = 'inline-block'; }
  if (session.level >= 60) { const rl = document.getElementById('roster-link'); if(rl) rl.style.display = 'inline-block'; }

  // Render content
  if (session.level <= 30) renderNewAgentView(session);
  else renderLeaderView(session);
})();

// ── MONDAY SYNC BANNER ───────────────────────────────────────
function renderMondaySyncBanner(session) {
  try {
    const raw = localStorage.getItem('dba_monday_agent_sync');
    if (!raw) return;
    const sync = JSON.parse(raw);
    if (!sync.newAgents?.length && !sync.updatedAgents?.length) return;

    // Only show if checked recently (within 24h)
    const age = Date.now() - new Date(sync.checkedAt).getTime();
    if (age > 86400000) return;

    const banner = document.getElementById('monday-sync-banner');
    if (!banner) return;

    const newCount = sync.newAgents?.length || 0;
    const updCount = sync.updatedAgents?.length || 0;
    let html = '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">'
      + '<div style="flex:1;">'
      + '<div style="font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:6px;">'
      + '☁ Monday.com Agent Sync — ' + new Date(sync.checkedAt).toLocaleTimeString() + '</div>'
      + '<div style="font-size:12px;color:rgba(255,255,255,.6);margin-bottom:8px;">'
      + 'Board has <strong style="color:var(--cream);">' + sync.totalOnBoard + '</strong> agents · auth.js has <strong style="color:var(--cream);">' + sync.totalInAuth + '</strong>';

    if (newCount) html += ' · <strong style="color:#2DCA73;">' + newCount + ' new agent' + (newCount>1?'s':'') + ' on board not in auth.js</strong>';
    if (updCount) html += ' · <strong style="color:#5DADE2;">' + updCount + ' field update' + (updCount>1?'s':'') + ' available</strong>';
    html += '</div>';

    if (newCount > 0) {
      html += '<div style="font-size:11px;color:var(--gold);font-family:Barlow Condensed,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;">Suggested auth.js additions:</div>';
      html += '<pre style="background:var(--navy);border:1px solid rgba(255,255,255,.1);border-radius:3px;padding:10px 12px;font-size:11px;color:#E8C97A;overflow-x:auto;margin-bottom:8px;">';
      sync.newAgents.forEach(a => {
        html += '  {\n'
          + '    id: "' + a.id + '", name: "' + a.name + '",\n'
          + '    pin: "' + (a.pin !== 'XXXX' ? a.pin : 'SET_PIN') + '", role: "' + mapRoleLabel(a.role) + '",\n'
          + '    phpId: "' + (a.phpId||'') + '", phone: "' + (a.phone||'') + '",\n'
          + '    email: "' + (a.email||'') + '",\n'
          + '    licenseStates: [], enrollmentDate: "", uplineId: null\n'
          + '  },\n';
      });
      html += '</pre>';
      html += '<button onclick="copyAgentSnippet()" style="background:var(--gold);color:var(--navy);border:none;padding:6px 14px;border-radius:3px;font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:700;cursor:pointer;margin-right:8px;">Copy Snippet</button>';
    }

    if (updCount > 0) {
      html += '<div style="margin-top:8px;font-size:11px;color:rgba(255,255,255,.5);">';
      sync.updatedAgents.forEach(a => {
        html += '&#8635; <strong style="color:var(--cream);">' + a.name + '</strong>: ';
        html += Object.entries(a.changes).map(([k,v]) => k + ' → "' + v + '"').join(', ');
        html += '<br>';
      });
      html += '</div>';
    }

    html += '</div>'
      + '<button onclick="dismissSyncBanner()" style="background:transparent;border:none;color:var(--slate);font-size:16px;cursor:pointer;flex-shrink:0;">&#x2715;</button>'
      + '</div>';

    banner.innerHTML = html;
    banner.style.display = 'block';
  } catch(e) { console.warn('Banner error:', e); }
}

function mapRoleLabel(label) {
  if (!label) return 'trainee';
  const l = label.toLowerCase();
  if (l.includes('super')) return 'super_admin';
  if (l.includes('agency builder')) return 'agency_builder';
  if (l.includes('sr. exec') || l.includes('senior exec')) return 'senior_exec_board';
  if (l.includes('exec board')) return 'exec_board_council';
  if (l.includes('senior board')) return 'senior_board_council';
  if (l.includes('board council')) return 'board_council';
  if (l.includes('chairman')) return 'chairmans_council';
  if (l.includes('president')) return 'presidents_council';
  if (l.includes('evp')) return 'evp';
  if (l.includes('svp')) return 'svp';
  if (l.includes('executive md') || l.includes('exec md')) return 'executive_md';
  if (l.includes('senior md')) return 'senior_md';
  if (l.includes('marketing director') || l.includes('mktg')) return 'marketing_director';
  if (l.includes('producing') || l.includes('prod md')) return 'producing_md';
  if (l.includes('director')) return 'director';
  if (l.includes('field associate') || l.includes('field assoc')) return 'field_associate';
  if (l.includes('associate')) return 'associate';
  return 'trainee';
}

function copyAgentSnippet() {
  try {
    const sync = JSON.parse(localStorage.getItem('dba_monday_agent_sync')||'{}');
    const snippets = (sync.newAgents||[]).map(a =>
      '  {\n'
      + '    id: "' + a.id + '", name: "' + a.name + '",\n'
      + '    pin: "' + (a.pin !== 'XXXX' ? a.pin : 'SET_PIN') + '", role: "' + mapRoleLabel(a.role) + '",\n'
      + '    phpId: "' + (a.phpId||'') + '", phone: "' + (a.phone||'') + '",\n'
      + '    email: "' + (a.email||'') + '",\n'
      + '    licenseStates: [], enrollmentDate: "", uplineId: null\n'
      + '  },'
    ).join('\n');
    navigator.clipboard.writeText(snippets).then(() => {
      const b = document.querySelector('#monday-sync-banner button');
      if (b) { const t = b.textContent; b.textContent = '✓ Copied!'; setTimeout(()=>b.textContent=t, 2000); }
    });
  } catch(e) {}
}

function dismissSyncBanner() {
  const b = document.getElementById('monday-sync-banner');

}

// ── TEAM TABLE ────────────────────────────────────────────────
function buildTeamTable(level) {
  const sorted = AGENTS
    .map(a => ({...a, stats: DEMO_STATS[a.id]||{}}))
    .sort((a,b) => (b.stats.pts||0)-(a.stats.pts||0))
    .slice(0, 8);
  const maxPts = sorted[0]?.stats?.pts || 1;
  const rows = sorted.map((ag, i) => {
    const s = ag.stats;
    const pct = Math.round(((s.pts||0)/maxPts)*100);
    const rc = {admin:'badge-md',agency_builder:'badge-md',marketing_director:'badge-md',director:'badge-dir',field_associate:'badge-fa',associate:'badge-assoc',trainee:'badge-train'}[ag.role]||'badge-train';
    return `<tr>
      <td style="width:24px;font-family:Barlow Condensed,sans-serif;font-size:14px;font-weight:800;color:${i<3?'var(--gold)':'var(--slate)'};">${['🥇','🥈','🥉'][i]||i+1}</td>
      <td><div style="display:flex;align-items:center;gap:7px;"><div class="av">${getInitials(ag.name)}</div><div style="font-size:12px;font-weight:600;">${ag.name}</div></div></td>
      <td><span class="badge ${rc}">${getRoleLabel(ag.role)}</span></td>
      <td style="text-align:right;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:600;">${s.calls||0}</td>
      <td style="text-align:right;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;color:var(--gold-light);">${(s.pts||0).toLocaleString()}</td>
      <td><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div></td>
    </tr>`;
  }).join('');
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>#</th><th>Agent</th><th>Level</th><th style="text-align:right;">Calls</th><th style="text-align:right;">Points</th><th>Rank</th></tr></thead>
    <tbody>${rows}</tbody>

}

function buildContestMini() {
  const session = AUTH.getSession();
  const myStats = DEMO_STATS[session.agentId] || {};
  const rec = myStats.recruits || 0;
  const pts = myStats.pts || 0;
  const TIERS = [{name:'Bronze',rec:10,pts:10000},{name:'Silver',rec:20,pts:20000},{name:'Gold',rec:30,pts:30000}];
  const next = TIERS.find(t => rec < t.rec || pts < t.pts) || TIERS[2];
  const rPct = Math.min(100, Math.round(rec/next.rec*100));
  const pPct = Math.min(100, Math.round(pts/next.pts*100));
  return `
    <div style="font-size:12px;color:var(--slate);margin-bottom:10px;">Next: <strong style="color:var(--gold)">${next.name}</strong> · ${next.rec}R / ${next.pts.toLocaleString()}pts</div>
    <div style="font-size:11px;color:var(--slate);margin-bottom:4px;">Recruits: ${rec} / ${next.rec}</div>
    <div style="height:7px;background:rgba(201,168,76,0.1);border-radius:3px;overflow:hidden;margin-bottom:10px;">
      <div style="height:7px;background:${rPct>=100?'var(--success)':'var(--gold)'};border-radius:3px;width:${rPct}%;transition:width 0.7s;"></div>
    </div>
    <div style="font-size:11px;color:var(--slate);margin-bottom:4px;">Points: ${pts.toLocaleString()} / ${next.pts.toLocaleString()}</div>
    <div style="height:7px;background:rgba(201,168,76,0.1);border-radius:3px;overflow:hidden;margin-bottom:12px;">
      <div style="height:7px;background:${pPct>=100?'var(--success)':'var(--gold)'};border-radius:3px;width:${pPct}%;transition:width 0.7s;"></div>
    </div>
    <a href="incentives.html" style="font-size:12px;color:var(--gold);text-decoration:none;">Full Contest Dashboard →</a>`;
}

// ── AI CHAT ───────────────────────────────────────────────────

function buildChatUI(id) {
  const prompts = id === 'leader'
    ? ['Who needs coaching?','Write team motivation','Lights Out strategy','Recruiting focus']
    : ['What to say on first call?','Handle objection','BOM invite script','What are living benefits?'];
  return `<div class="chat-box">
    <div class="chat-prompts">${prompts.map(p=>`<span class="chip" onclick="sendChip('${id}','${p.replace(/'/g,"\\'")}')">${p}</span>`).join('')}</div>
    <div class="chat-msgs" id="msgs-${id}">
      <div class="msg ai"><div class="name">Dynasty AI Coach</div>Ready to help — ask me anything about scripts, strategy, recruiting, or production.</div>
    </div>
    <div class="chat-input-row">
      <input class="chat-input" id="input-${id}" placeholder="Ask your coach…" onkeydown="if(event.key==='Enter')sendChat('${id}')">
      <button class="chat-send" onclick="sendChat('${id}')">Send</button>
    </div>
  </div>`;
}

function initChat(id, sys) { chatSystems[id]=sys; chatHistory[id]=[]; }
function sendChip(id, text) { document.getElementById('input-'+id).value=text; sendChat(id); }

async function sendChat(id) {
  const input = document.getElementById('input-'+id);
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  const msgs = document.getElementById('msgs-'+id);
  msgs.innerHTML += `<div class="msg user">${msg}</div>`;
  msgs.innerHTML += `<div class="msg ai typing" id="typing-${id}"><div class="name">Dynasty AI Coach</div><span></span><span></span><span></span></div>`;
  msgs.scrollTop = msgs.scrollHeight;
  chatHistory[id] = chatHistory[id]||[];
  chatHistory[id].push({role:'user',content:msg});
  if (chatHistory[id].length > 10) chatHistory[id] = chatHistory[id].slice(-10);
  const reply = await askAI(chatHistory[id], chatSystems[id]);
  document.getElementById('typing-'+id)?.remove();
  const txt = reply || '(AI coach offline — check API configuration)';
  chatHistory[id].push({role:'assistant',content:txt});
  msgs.innerHTML += `<div class="msg ai"><div class="name">Dynasty AI Coach</div>${txt}</div>`;
  msgs.scrollTop = msgs.scrollHeight;
}


[functions]
  # Extended timeout for Claude vision calls (screenshots can take 20-30s)
  node_bundler = "esbuild"

[functions."claude"]
  timeout = 60

[functions."gcal"]
  timeout = 30

[functions."auth"]
  timeout = 10

[functions."roster"]
  timeout = 15

[functions."pipeline"]
  timeout = 30

[functions."automations"]
  timeout = 15

# Dynasty Builders Academy — Netlify Configuration

[build]
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/auth.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[[redirects]]
  from = "/api/monday"
  to   = "/.netlify/functions/monday"
  status = 200

[[redirects]]
  from   = "/api/claude"
  to     = "/.netlify/functions/claude"
  status = 200

[[redirects]]
  from   = "/api/gcal"
  to     = "/.netlify/functions/gcal"
  status = 200

[[redirects]]
  from   = "/api/config"
  to     = "/.netlify/functions/config"
  status = 200

[[redirects]]
  from   = "/api/auth"
  to     = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from   = "/api/roster"
  to     = "/.netlify/functions/roster"
  status = 200

[[redirects]]
  from   = "/api/pipeline"
  to     = "/.netlify/functions/pipeline"
  status = 200

[[redirects]]
  from   = "/api/automations"
  to     = "/.netlify/functions/automations"
  status = 200

# ── REQUIRED ENVIRONMENT VARIABLES ─────────────────────────────
# Set these in Netlify → Site Configuration → Environment Variables:
#
#   MONDAY_API_KEY      Your Monday.com API token
#   TOKEN_SECRET        Random 32+ char secret (openssl rand -hex 32)
#   ROSTER_BOARD_ID     Monday board ID for agent roster (optional)
#   GOOGLE_CLIENT_ID    Google OAuth client ID
#   GOOGLE_CLIENT_SECRET  Google OAuth client secret
#
# TOKEN_SECRET secures all session tokens. If compromised, rotate it
# and all agents will need to log in again (tokens invalidated).
